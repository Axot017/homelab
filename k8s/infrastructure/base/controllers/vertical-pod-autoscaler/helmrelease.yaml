apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: vpa
spec:
  interval: 10m
  chart:
    spec:
      chart: vpa
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: vpa
        namespace: flux-system
      interval: 10m
  values:
    rbac:
      create: true

    recommender:
      enabled: true

    updater:
      enabled: true

    admissionController:
      enabled: true
      generateCertificate: true
      registerWebhook: false
      mutatingWebhookConfiguration:
        failurePolicy: Ignore

    crds:
      enabled: true
      keep: true

    metrics-server:
      enabled: false
